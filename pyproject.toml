[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "polars-ta"
version = "2.0.0"
description = "Technical indicators for Polars DataFrames."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars==2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polars_ta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
