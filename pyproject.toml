[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "polars-ta"
version = "0.1.0"
description = "Technical indicators for Polars DataFrames."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
]

[dependency-groups]
dev = [
    "mcp[cli]>=1.28,<2",
    "polars-mcp>=0.2.1",
    "pytest>=8.0",
    "ruff>=0.9",
    "typer>=0.27.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polars_ta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
